<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"
    />
    <meta name="theme-color" content="#08090b" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arche — личная энциклопедия философии и культуры: карта идей на оси времени, причинные связи и учёба с интервальным повторением."
    />
    <title>Arche — карта знаний</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      Статический двойник формы обратной связи.
      Netlify находит формы только в HTML на этапе деплоя; SPA рендерит
      свою форму на клиенте, поэтому здесь лежит скрытая копия с теми же
      полями — POST со страницы /contact попадает в неё.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
